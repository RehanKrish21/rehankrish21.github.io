<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">Two non-image-forming routes from the retina</title>
  <desc id="d">Intrinsically photosensitive retinal ganglion cells send light information along two routes. One goes to the suprachiasmatic nucleus and affects learning, independently of the nucleus's pacemaker function. The other goes to the perihabenular nucleus of the thalamus, which connects to prefrontal cortex, dorsomedial striatum and nucleus accumbens, and affects mood. A separate image-forming route carries vision to visual cortex.</desc>
  <style>
    .ink{stroke:#141517;fill:none}
    .acc{stroke:#9E2A2B;fill:none}
    .faint{stroke:#9A9CA1;fill:none}
    .box{fill:#FCFCF9;stroke:#141517}
    .t{font-family:"CMU Serif","Latin Modern Roman","Computer Modern",Georgia,"Times New Roman",serif;fill:#141517}
    .g{fill:#6B6E73}
    .a{fill:#9E2A2B}
    .head{fill:#9E2A2B}
    @media (prefers-color-scheme:dark){
      .ink{stroke:#E9E7E1}.box{fill:#15161A;stroke:#E9E7E1}.t{fill:#E9E7E1}.g{fill:#9A9CA1}
      .acc{stroke:#E07A6B}.a{fill:#E07A6B}.head{fill:#E07A6B}.faint{stroke:#6B6E73}
    }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
    <marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A9CA1"/></marker>
  </defs>

  <!-- the eye -->
  <circle cx="74" cy="210" r="40" class="ink" stroke-width="1.6"/>
  <path d="M114 210a40 40 0 0 0-12-28" class="acc" stroke-width="4"/>
  <path d="M114 210a40 40 0 0 1-12 28" class="acc" stroke-width="4"/>
  <circle cx="58" cy="210" r="13" class="ink" stroke-width="1.6"/>
  <circle cx="58" cy="210" r="5" class="t"/>
  <text x="74" y="276" text-anchor="middle" class="t" font-size="17" font-weight="700">Retina</text>
  <text x="74" y="296" text-anchor="middle" class="t g" font-size="13" font-style="italic">ipRGCs (melanopsin)</text>

  <!-- image-forming vision: the route TRIBE v2 models -->
  <path d="M118 210H612" class="faint" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#mf)"/>
  <text x="360" y="202" text-anchor="middle" class="t g" font-size="13" font-style="italic">image-forming vision → thalamus → visual cortex</text>
  <text x="360" y="226" text-anchor="middle" class="t g" font-size="12">(the cortical route a model like TRIBE v2 predicts)</text>
  <text x="628" y="215" class="t g" font-size="14">seeing</text>

  <!-- route 1: SCN, learning -->
  <path d="M106 186C150 120 190 96 236 96" class="acc" stroke-width="2" marker-end="url(#m)"/>
  <rect x="240" y="70" width="150" height="54" rx="6" class="box" stroke-width="1.4"/>
  <text x="315" y="94" text-anchor="middle" class="t" font-size="18" font-weight="700">SCN</text>
  <text x="315" y="113" text-anchor="middle" class="t g" font-size="12">suprachiasmatic nucleus</text>
  <path d="M390 97H516" class="acc" stroke-width="2" marker-end="url(#m)"/>
  <text x="453" y="86" text-anchor="middle" class="t g" font-size="12" font-style="italic">without its pacemaker</text>
  <text x="453" y="116" text-anchor="middle" class="t g" font-size="12" font-style="italic">function</text>
  <rect x="520" y="70" width="170" height="54" rx="6" class="box" stroke-width="1.4"/>
  <text x="605" y="103" text-anchor="middle" class="t a" font-size="20" font-weight="700">Learning</text>

  <!-- route 2: PHb, mood -->
  <path d="M106 234C150 300 190 324 236 324" class="acc" stroke-width="2" marker-end="url(#m)"/>
  <rect x="240" y="298" width="150" height="54" rx="6" class="box" stroke-width="1.4"/>
  <text x="315" y="322" text-anchor="middle" class="t" font-size="18" font-weight="700">PHb</text>
  <text x="315" y="341" text-anchor="middle" class="t g" font-size="12">perihabenular nucleus</text>
  <path d="M390 325H516" class="acc" stroke-width="2" marker-end="url(#m)"/>
  <text x="453" y="314" text-anchor="middle" class="t g" font-size="12" font-style="italic">SCN-independent</text>
  <rect x="520" y="270" width="170" height="122" rx="6" class="box" stroke-width="1.4"/>
  <text x="605" y="300" text-anchor="middle" class="t a" font-size="20" font-weight="700">Mood</text>
  <text x="605" y="324" text-anchor="middle" class="t g" font-size="12">prefrontal cortex</text>
  <text x="605" y="339" text-anchor="middle" class="t g" font-size="12">(prelimbic, infralimbic)</text>
  <text x="605" y="359" text-anchor="middle" class="t g" font-size="12">dorsomedial striatum</text>
  <text x="605" y="379" text-anchor="middle" class="t g" font-size="12">nucleus accumbens</text>

  <text x="315" y="40" text-anchor="middle" class="t g" font-size="13" font-variant="small-caps">non-image-forming routes</text>
</svg>
