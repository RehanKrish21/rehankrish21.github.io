<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">The seal test: a formed gigaseal and a tip that missed the cell</title>
  <desc id="d">Two panels. On the left, the pipette tip is pressed against the cell membrane and gentle suction draws the membrane into the tip, forming a seal of more than one gigaohm. The same small test pulse then produces almost no current, only brief capacitive transients at the edges of the pulse. On the right, the tip has missed the cell and sits in the bath solution. Resistance stays at the few megaohms of the pipette itself, so the test pulse produces a large square current: a reading of the solution, not of the cell.</desc>
  <style>
    .ink{stroke:#141517;fill:none}
    .acc{stroke:#9E2A2B;fill:none}
    .cell{fill:#EDEBE4;stroke:#141517}
    .pip{fill:#FCFCF9;stroke:#141517}
    .t{font-family:"CMU Serif","Latin Modern Roman","Computer Modern",Georgia,"Times New Roman",serif;fill:#141517}
    .g{fill:#6B6E73}
    .a{fill:#9E2A2B}
    .div{stroke:#D9DAD6}
    @media (prefers-color-scheme:dark){
      .ink{stroke:#E9E7E1}.t{fill:#E9E7E1}.g{fill:#9A9CA1}
      .cell{fill:#23252B;stroke:#E9E7E1}.pip{fill:#15161A;stroke:#E9E7E1}
      .acc{stroke:#E07A6B}.a{fill:#E07A6B}.div{stroke:#33353B}
    }
  </style>

  <line x1="360" y1="18" x2="360" y2="326" class="div" stroke-width="1"/>

  <!-- ===== LEFT: the seal forms ===== -->
  <text x="40" y="30" class="t" font-size="18" font-weight="700">The seal forms</text>

  <!-- cell -->
  <ellipse cx="195" cy="118" rx="52" ry="42" class="cell" stroke-width="1.8"/>
  <ellipse cx="206" cy="124" rx="17" ry="14" class="ink" stroke-width="1.2"/>
  <!-- pipette, tip pressed onto the membrane -->
  <path d="M60 36 L163 93 L160 99 L50 48 Z" class="pip" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- membrane drawn up into the tip -->
  <path d="M161 96 q-9 7 -4 15 q6 6 12 -1" class="acc" stroke-width="2" fill="none"/>
  <text x="58" y="78" class="t g" font-size="13" font-style="italic" transform="rotate(29 58 78)">gentle suction</text>
  <text x="195" y="178" text-anchor="middle" class="t g" font-size="13">membrane drawn into the tip</text>

  <!-- trace -->
  <line x1="40" y1="300" x2="330" y2="300" class="div" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M40 300 L120 300 L120 258 C123 280 128 300 133 300 L230 300 L230 342 C233 320 238 300 243 300 L330 300"
        class="ink" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="40" y="240" class="t a" font-size="16" font-weight="700">&gt; 1 GΩ</text>
  <text x="190" y="292" text-anchor="middle" class="t g" font-size="13" font-style="italic">almost no current</text>
  <text x="138" y="262" class="t g" font-size="12">capacitive transients only</text>
  <text x="40" y="374" class="t g" font-size="13">You are recording the cell.</text>

  <!-- ===== RIGHT: the tip misses ===== -->
  <text x="400" y="30" class="t" font-size="18" font-weight="700">The tip misses</text>

  <ellipse cx="565" cy="130" rx="52" ry="42" class="cell" stroke-width="1.8"/>
  <ellipse cx="576" cy="136" rx="17" ry="14" class="ink" stroke-width="1.2"/>
  <!-- pipette passing above the cell, nothing sealed -->
  <path d="M420 32 L531 76 L529 82 L412 44 Z" class="pip" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- bath: open solution round the tip -->
  <g class="acc" stroke-width="1.2" stroke-dasharray="2 4" fill="none">
    <circle cx="540" cy="82" r="14"/><circle cx="540" cy="82" r="24"/>
  </g>
  <text x="596" y="74" class="t a" font-size="13" font-style="italic">bath solution</text>
  <text x="565" y="190" text-anchor="middle" class="t g" font-size="13">no contact, no seal</text>

  <line x1="400" y1="300" x2="690" y2="300" class="div" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M400 300 L480 300 L480 243 L590 243 L590 300 L690 300" class="ink" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="400" y="232" class="t a" font-size="16" font-weight="700">a few MΩ</text>
  <text x="535" y="237" text-anchor="middle" class="t g" font-size="13" font-style="italic">a large square current</text>
  <text x="400" y="374" class="t g" font-size="13">You are recording the solution around it.</text>

  <text x="360" y="352" text-anchor="middle" class="t g" font-size="12" font-style="italic">the same test pulse in both</text>
</svg>
